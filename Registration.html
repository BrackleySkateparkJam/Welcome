<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Brackley Jam '26 Registration</title>

<style>

body{
  margin:0;
  padding:20px;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.header-image{
  width:100%;
  display:block;
  border-radius:12px;
  margin-bottom:20px;
}

input,
select{
  width:100%;
  padding:15px;
  font-size:16px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:8px;
  background:#1976D2;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:disabled{
  background:#999;
}

.help-box{
  background:#f7f7f7;
  padding:15px;
  border-radius:8px;
  margin-bottom:15px;
}

  .signature-section {
  margin-bottom: 20px;
}

.signature-section strong {
  display: block;
  margin-bottom: 10px;
}

#signaturePad {
  width: 100%;
  height: 250px;
  border: 2px solid #ccc;
  border-radius: 10px;
  background: #fff;
  margin-bottom: 10px;
  touch-action: none;
}

</style>

</head>

<body>

<div class="container">

  <img
    class="header-image"
    src="https://drive.google.com/thumbnail?id=16c2JgNhhnjlgLTM3XSptVcywyd1eJ0cm&sz=w1000"
    alt="Brackley Jam">

  <h1>Brackley Jam '26 Registration</h1>

  <input
    id="name"
    placeholder="Competitor Name">

  <input
    id="age"
    type="number"
    placeholder="Age">

  <select
    id="discipline"
    onchange="loadLevels();showLevelGuide();">

    <option value="">
      Choose Sport
    </option>

    <option value="Skateboard">
      Skateboard
    </option>

    <option value="Scooter">
      Scooter
    </option>

    <option value="BMX">
      BMX
    </option>

    <option value="Skates">
      Inline Skates
    </option>

  </select>

  <details
    id="levelGuide"
    class="help-box"
    style="display:none;">

    <summary>
      Not sure which level to choose?
    </summary>

    <div id="levelGuideContent"></div>

  </details>

  <select id="level">

    <option value="">
      Choose Skill Level
    </option>

  </select>

  <input
    id="parent"
    placeholder="Parent / Guardian Name">

  <div class="signature-section">

  <strong>
    Signature
  </strong>

  <canvas id="signaturePad"></canvas>

  <button
    type="button"
    onclick="clearSignature()">
    Clear Signature
  </button>

</div>

  <input
    id="contact"
    placeholder="Emergency Contact">

  <label>

    <input
      type="checkbox"
      id="termsAccepted">

    I accept the event terms and conditions.

  </label>

  <br><br>

  <button
    id="registerButton"
    onclick="register()">

    Register

  </button>

  <div id="result"></div>

</div>
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
 

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbzAbPL1C-vvuLQPPiLfV_6QJGu8uOH8e_fRLugrvdpvL0CsMyxHlYklBkOsmS_8H15n/exec";
let canvas;
let ctx;
let drawing = false;
  
async function loadLevels() {

  const discipline =
    document.getElementById(
      "discipline"
    ).value;

  if (!discipline) return;

  const dropdown =
    document.getElementById(
      "level"
    );

  dropdown.innerHTML = `
    <option>
      ⏳ Checking availability...
    </option>
  `;

  const response =
    await fetch(
      API_URL +
      "?action=capacity&discipline=" +
      encodeURIComponent(
        discipline
      )
    );

  const levels =
    await response.json();

  dropdown.innerHTML =
    `<option value="">
      Choose Skill Level
    </option>`;

  levels.forEach(function(item){

    dropdown.innerHTML += `
      <option
        value="${item.level}"
        ${item.spacesLeft <= 0 ? "disabled" : ""}>
        ${item.level}
        (${item.spacesLeft} spaces left)
      </option>
    `;
  });

}

function showLevelGuide() {

  const sport =
    document.getElementById(
      "discipline"
    ).value;

  const box =
    document.getElementById(
      "levelGuide"
    );

  const content =
    document.getElementById(
      "levelGuideContent"
    );

  box.style.display = "block";

  if (sport === "Scooter") {

    content.innerHTML = `
      <h3>🛴 Scooter</h3>

      <strong>Beginner</strong>
      <p>
      Ride confidently around the park,
      Bunny Hop, Manual, 180.
      </p>

      <strong>Intermediate</strong>
      <p>
      Tailwhips, Barspins,
      Boardslides, Transfers.
      </p>

      <strong>Advanced</strong>
      <p>
      Double Whips, Bri Flips,
      Flairs and technical combinations.
      </p>
    `;
  }

}
window.onload = function () {

  canvas =
    document.getElementById(
      "signaturePad"
    );

  ctx =
    canvas.getContext("2d");

  canvas.width =
    canvas.offsetWidth;

  canvas.height = 250;

  ctx.lineWidth = 3;
  ctx.lineCap = "round";

  canvas.addEventListener(
    "mousedown",
    startDraw
  );

  canvas.addEventListener(
    "mousemove",
    draw
  );

  canvas.addEventListener(
    "mouseup",
    stopDraw
  );

  canvas.addEventListener(
    "mouseleave",
    stopDraw
  );

  canvas.addEventListener(
    "touchstart",
    startTouch
  );

  canvas.addEventListener(
    "touchmove",
    moveTouch
  );

  canvas.addEventListener(
    "touchend",
    stopDraw
  );

};

function startDraw(e) {

  drawing = true;

  ctx.beginPath();

  ctx.moveTo(
    e.offsetX,
    e.offsetY
  );

}

function draw(e) {

  if (!drawing) return;

  ctx.lineTo(
    e.offsetX,
    e.offsetY
  );

  ctx.stroke();

}

function stopDraw() {

  drawing = false;

}

function startTouch(e) {

  e.preventDefault();

  drawing = true;

  const rect =
    canvas.getBoundingClientRect();

  const touch =
    e.touches[0];

  ctx.beginPath();

  ctx.moveTo(
    touch.clientX - rect.left,
    touch.clientY - rect.top
  );

}

function moveTouch(e) {

  e.preventDefault();

  if (!drawing) return;

  const rect =
    canvas.getBoundingClientRect();

  const touch =
    e.touches[0];

  ctx.lineTo(
    touch.clientX - rect.left,
    touch.clientY - rect.top
  );

  ctx.stroke();

}

function clearSignature() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}
async function register() {

  const button =
    document.getElementById(
      "registerButton"
    );

  button.disabled = true;

  const blank =
    document.createElement(
      "canvas"
    );

  blank.width =
    canvas.width;

  blank.height =
    canvas.height;

  if (
    canvas.toDataURL() ===
    blank.toDataURL()
  ) {

    alert(
      "Signature is required."
    );

    button.disabled = false;

    return;

  }

  const response =
    await fetch(API_URL, {

      method: "POST",

      body: JSON.stringify({

        action: "register",

        data: {

          name:
            document.getElementById(
              "name"
            ).value,

          age:
            document.getElementById(
              "age"
            ).value,

          discipline:
            document.getElementById(
              "discipline"
            ).value,

          level:
            document.getElementById(
              "level"
            ).value,

          parent:
            document.getElementById(
              "parent"
            ).value,

          contact:
            document.getElementById(
              "contact"
            ).value,

       signature:
  canvas.toDataURL(
    "image/png"
  )

        }

      })

    });

  const result =
    await response.json();

if (result.success) {

  const registration =
    result.result;

  document.querySelector(".container").innerHTML = `

    <div class="success-card">

      <div id="confirmationCard">

        <img
          src="https://drive.google.com/thumbnail?id=1bDdZPr-CSgyaRtpX_-jTkOyR4hUACQak&sz=w1000"
          alt="Brackley Jam Banner"
          class="header-image">

        <h1>✅ Registration Confirmed</h1>

        <p>
          Thank you for registering for
          <strong>Brackley Jam '26'</strong>.
        </p>

        <div class="confirmation-details">

          <div>
            <strong>Competitor Number:</strong>
            ${registration.competitorNo}
          </div>

          <div>
            <strong>Name:</strong>
            ${registration.name}
          </div>

          <div>
            <strong>Age:</strong>
            ${registration.age}
          </div>

          <div>
            <strong>Sport:</strong>
            ${registration.discipline}
          </div>

          <div>
            <strong>Skill Level:</strong>
            ${registration.level}
          </div>

          <div>
            <strong>Parent / Guardian:</strong>
            ${registration.parent || "N/A"}
          </div>

          <div>
            <strong>Emergency Contact:</strong>
            ${registration.contact || "N/A"}
          </div>

          <div>
            <strong>Registered:</strong>
            ${registration.timestamp}
          </div>

        </div>

        <h2>
          Please make a note of your competitor number
        </h2>

        <div class="competitor-number">
          ${registration.competitorNo}
        </div>

      </div>

      <button onclick="downloadConfirmation()">
        Download Confirmation
      </button>

    </div>

  `;

} else {

  alert(result.message);

}

  button.disabled = false;

}

  
function downloadConfirmation() {

  const card =
    document.getElementById(
      "confirmationCard"
    );

  html2canvas(card, {
    backgroundColor: "#ffffff",
    scale: 2
  }).then(function (canvas) {

    canvas.toBlob(function (blob) {

      const file =
        new File(
          [blob],
          "BrackleyJamConfirmation.png",
          {
            type: "image/png"
          }
        );

      // Preferred path:
      // native share sheet on mobile

      if (
        navigator.canShare &&
        navigator.canShare({
          files: [file]
        })
      ) {

        navigator.share({
          files: [file],
          title:
            "Brackley Jam Confirmation"
        }).catch(function(err) {

          console.log(
            "Share cancelled or failed:",
            err
          );

        });

        return;

      }

      // Fallback:
      // open image in new tab

      const blobUrl =
        URL.createObjectURL(blob);

      const win =
        window.open(
          blobUrl,
          "_blank"
        );

      // Popup blocked

      if (!win) {

        const link =
          document.createElement(
            "a"
          );

        link.href =
          blobUrl;

        link.download =
          "BrackleyJamConfirmation.png";

        document.body
          .appendChild(link);

        link.click();

        document.body
          .removeChild(link);

      }

    }, "image/png");

  });

}
</script>

</body>
</html>
