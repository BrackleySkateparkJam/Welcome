<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Brackley Jam '26 Registration</title>

<style>

body{
  margin:0;
  padding:20px;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.header-image{
  width:100%;
  display:block;
  border-radius:12px;
  margin-bottom:20px;
}

input,
select{
  width:100%;
  padding:15px;
  font-size:16px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:8px;
  background:#1976D2;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:disabled{
  background:#999;
}

.help-box{
  background:#f7f7f7;
  padding:15px;
  border-radius:8px;
  margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container">

  <img
    class="header-image"
    src="https://drive.google.com/thumbnail?id=16c2JgNhhnjlgLTM3XSptVcywyd1eJ0cm&sz=w1000"
    alt="Brackley Jam">

  <h1>Brackley Jam '26 Registration</h1>

  <input
    id="name"
    placeholder="Competitor Name">

  <input
    id="age"
    type="number"
    placeholder="Age">

  <select
    id="discipline"
    onchange="loadLevels();showLevelGuide();">

    <option value="">
      Choose Sport
    </option>

    <option value="Skateboard">
      Skateboard
    </option>

    <option value="Scooter">
      Scooter
    </option>

    <option value="BMX">
      BMX
    </option>

    <option value="Skates">
      Inline Skates
    </option>

  </select>

  <details
    id="levelGuide"
    class="help-box"
    style="display:none;">

    <summary>
      Not sure which level to choose?
    </summary>

    <div id="levelGuideContent"></div>

  </details>

  <select id="level">

    <option value="">
      Choose Skill Level
    </option>

  </select>

  <input
    id="parent"
    placeholder="Parent / Guardian Name">

  <input
    id="contact"
    placeholder="Emergency Contact">

  <label>

    <input
      type="checkbox"
      id="termsAccepted">

    I accept the event terms and conditions.

  </label>

  <br><br>

  <button
    id="registerButton"
    onclick="register()">

    Register

  </button>

  <div id="result"></div>

</div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbzAbPL1C-vvuLQPPiLfV_6QJGu8uOH8e_fRLugrvdpvL0CsMyxHlYklBkOsmS_8H15n/exec";

async function loadLevels() {

  const discipline =
    document.getElementById(
      "discipline"
    ).value;

  if (!discipline) return;

  const dropdown =
    document.getElementById(
      "level"
    );

  dropdown.innerHTML = `
    <option>
      ⏳ Checking availability...
    </option>
  `;

  const response =
    await fetch(
      API_URL +
      "?action=capacity&discipline=" +
      encodeURIComponent(
        discipline
      )
    );

  const levels =
    await response.json();

  dropdown.innerHTML =
    `<option value="">
      Choose Skill Level
    </option>`;

  levels.forEach(function(item){

    dropdown.innerHTML += `
      <option
        value="${item.level}"
        ${item.spacesLeft <= 0 ? "disabled" : ""}>
        ${item.level}
        (${item.spacesLeft} spaces left)
      </option>
    `;
  });

}

function showLevelGuide() {

  const sport =
    document.getElementById(
      "discipline"
    ).value;

  const box =
    document.getElementById(
      "levelGuide"
    );

  const content =
    document.getElementById(
      "levelGuideContent"
    );

  box.style.display = "block";

  if (sport === "Scooter") {

    content.innerHTML = `
      <h3>🛴 Scooter</h3>

      <strong>Beginner</strong>
      <p>
      Ride confidently around the park,
      Bunny Hop, Manual, 180.
      </p>

      <strong>Intermediate</strong>
      <p>
      Tailwhips, Barspins,
      Boardslides, Transfers.
      </p>

      <strong>Advanced</strong>
      <p>
      Double Whips, Bri Flips,
      Flairs and technical combinations.
      </p>
    `;
  }

}

async function register() {

  const button =
    document.getElementById(
      "registerButton"
    );

  button.disabled = true;

  const response =
    await fetch(API_URL, {

      method: "POST",

      body: JSON.stringify({

        action: "register",

        data: {

          name:
            document.getElementById(
              "name"
            ).value,

          age:
            document.getElementById(
              "age"
            ).value,

          discipline:
            document.getElementById(
              "discipline"
            ).value,

          level:
            document.getElementById(
              "level"
            ).value,

          parent:
            document.getElementById(
              "parent"
            ).value,

          contact:
            document.getElementById(
              "contact"
            ).value,

          signature: ""

        }

      })

    });

  const result =
    await response.json();

if (result.success) {

  const registration =
    result.result;

  document.querySelector(".container").innerHTML = `

    <h1>
      ✅ Registration Confirmed
    </h1>

    <p>
      Competitor Number:
      <strong>
        ${registration.competitorNo}
      </strong>
    </p>

    <button
      onclick="alert('download button works')">

      Download Confirmation

    </button>

  `;

} else {

  alert(result.message);

}

  button.disabled = false;

}

</script>

</body>
</html>
