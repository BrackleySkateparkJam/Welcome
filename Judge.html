<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Judge Scorings</title>

  <link rel="stylesheet" href="judge.css">

</head>

<body>

  <div class="container">

    <h1>Judge Scoring</h1>

    <div class="section-box">

      <h2>Competition Filter</h2>

      <select id="discipline">

        <option value="">
          Choose Sport
        </option>

        <option value="Skateboard">
          Skateboard
        </option>

        <option value="Scooter">
          Scooter
        </option>

        <option value="BMX">
          BMX
        </option>

 

      </select>

      <select id="level">

        <option value="">
          Choose Level
        </option>

        <option value="Beginner">
          Beginner
        </option>

        <option value="Intermediate">
          Intermediate
        </option>

        <option value="Advanced">
          Advanced
        </option>

      </select>

      <select id="run">

        <option value="Run1">
          Run 1
        </option>

        <option value="Run2">
          Run 2
        </option>

      </select>

      <button onclick="loadCompetitors()">
        Load Competitors
      </button>

    </div>

    <div class="section-box">

      <h2>Score Entry</h2>

      <select id="competitor">

        <option value="">
          Select Competitor
        </option>

      </select>

      <div class="score-grid">

        <input
          id="j1"
          inputmode="decimal"
          type="number"
          min="0"
          max="30"
          step="0.1"
          placeholder="Difficulty (Max 30)"
          oninput="updateTotal()">

        <input
          id="j2"
          inputmode="decimal"
          type="number"
          min="0"
          max="25"
          step="0.1"
          placeholder="Execution (Max 25)"
          oninput="updateTotal()">

        <input
          id="j3"
          type="number"
          inputmode="decimal"
          min="0"
          max="20"
          step="0.1"
          placeholder="Flow & Style (Max 20)"
          oninput="updateTotal()">

        <input
          id="j4"
          type="number"
          inputmode="decimal"
          min="0"
          max="15"
          step="0.1"
          placeholder="Variety (Max 15)"
          oninput="updateTotal()">

                <input
          id="j5"
          type="number"
                  inputmode="decimal"
          min="0"
          max="10"
          step="0.1"
          placeholder="Consistency (Max 10)"
          oninput="updateTotal()">

<textarea
  id="comment"
  placeholder="Judge Comments"
  rows="4"></textarea>

      </div>

      <input
        id="totalScore"
        type="number"
        step="0.1"
        placeholder="Total Score (editable)">

      <button onclick="saveScore()">
        Save Score
      </button>

    </div>

    <h2 id="result"></h2>

  </div>

  <div
    id="loadingOverlay"
    class="loading-overlay">

    <div class="loading-box">

      <div class="spinner"></div>

      <div>
        Loading...
        <br>
        Please wait
      </div>

    </div>

  </div>

  <script src="js/judge.js"></script>

</body>

</html>
