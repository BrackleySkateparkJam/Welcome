<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>
    Brackley Skatepark Jam 2026 Leaderboard
  </title>

  <link
    rel="stylesheet"
    href="css\Leaderboard.css">

</head>

<body>

  <div class="container">

    <div class="header">

      <h1>
        🏆 Brackley Skatepark Jam 2026
      </h1>

      <p>
        Live Competition Results
      </p>

    </div>

    <div class="refresh-info">

      Auto refresh every 30 seconds

    </div>

    <div
      id="leaderboard">

      <div class="loading">

        Loading leaderboard...

      </div>

    </div>

  </div>

  <div
    id="loadingOverlay"
    class="loading-overlay">

    <div class="loading-box">

      <div class="spinner"></div>

      <div>

        Loading Results...

      </div>

    </div>

  </div>

  <script>js\leaderboard.js</script>

</body>

</html>
